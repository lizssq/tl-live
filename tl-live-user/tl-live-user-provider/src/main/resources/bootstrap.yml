spring:
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  profiles:
    active: dev
  application:
    name: tl-live-user-provider
  cloud:
    nacos:
      discovery:
        namespace: tl-live
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        namespace: tl-live
        file-extension: yml
        import-check:
          enabled: false
        shared-configs:
            - data-id: tl-live-common-db.yml
              refresh: true
            - data-id: tl-live-common-dubbo.yml
              refresh: true
#指定Mybatis的Mapper文件
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: org.tl.user.provider.entity
  default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler # 启用枚举处理器
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

tllive:
  live:
    room:
      push_url: rtmp://localhost/hls
      pull_url: http://localhost:/hls/

aliyun:
  idcert:
    host: https://idcert.market.alicloudapi.com
    path: /idcard
    appcode: abb17336bd1a4edf9c547defa30a576a

