spring:
  profiles:
    active: dev
  application:
    name: tl-live-user-provider
  cloud:
    nacos:
      discovery:
        namespace: tl-live
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        namespace: tl-live
        file-extension: yml
        import-check:
          enabled: false
        shared-configs:
            - data-id: tl-live-common-db.yml
              refresh: true
            - data-id: tl-live-common-dubbo.yml
              refresh: true
#指定Mybatis的Mapper文件
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: org.tl.user.provider.entity


tllive:
  live:
    room:
      push_url: rtmp://localhost/hls
      pull_url: http://localhost:/hls/