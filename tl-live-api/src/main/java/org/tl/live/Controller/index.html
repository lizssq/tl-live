<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HLS VOD Test</title>
    <link href="https://vjs.zencdn.net/7.15.4/video-js.css" rel="stylesheet"/>
    <style>
        .video-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }
        #my-video {
            width: 800px;  /* 确保宽度大于 400px */
            height: 600px; /* 确保高度大于 300px */
        }
    </style>
</head>
<body>
<div class="video-container">
    <video id="my-video" class="video-js vjs-default-skin" controls preload="auto" width="800" height="600">
        <source src="http://127.0.0.1/hls/1.m3u8" type="application/x-mpegURL">
        <p class="vjs-no-js">
            To view this video please enable JavaScript, and consider upgrading to a web browser that
            <a href="https://videojs.com/html5-video-support/" target="_blank">supports HTML5 video</a>
        </p>
    </video>
</div>

<script src="https://vjs.zencdn.net/7.15.4/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/videojs-contrib-hls/dist/videojs-contrib-hls.min.js"></script>
<script>
    var player = videojs('my-video');
    player.play();
</script>
</body>
</html>
