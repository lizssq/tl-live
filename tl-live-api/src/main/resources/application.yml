server:
    port: 8081

#nacos配置
spring:
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  application:
    name: tl-live-api
  cloud:
    nacos:
      discovery:
        namespace: tl-live
        server-addr: 127.0.0.1:8848
        metadata:
          protocol: http
  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          min-idle: 10
          max-active: 100
          max-idle: 10

#dubbo配置
dubbo:
  application:
    name: ${spring.application.name}
    qos-enable: false
  registry:
    address: nacos://127.0.0.1:8848?namespace=tl-live
    id: nacos-registry
  protocol:
    name: dubbo
    port: -1

tllive:
  im:
    imInstance: tl-live-im-server

alipay:
  protocol: https
  gateway-host: openapi-sandbox.dl.alipaydev.com
  sign-type: RSA2
  app-id: 2021000148661015
  notify-url:  http://a8e64b69.natappfree.cc/payment/alipay/notify
  merchant-private-key: |
    
  alipay-public-key: |
    




