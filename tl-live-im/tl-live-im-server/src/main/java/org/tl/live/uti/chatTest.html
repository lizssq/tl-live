<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WebSocket测试页面</title>
    <script>
        var socket;

        // 检查浏览器是否支持WebSocket
        if (!window.WebSocket) {
            alert("浏览器不支持WebSocket");
        }

        // 连接WebSocket服务器
        function connect() {
            var websocketUrl = "ws://localhost:8989/chat/102";
            socket = new WebSocket(websocketUrl, "ctWQYQpX");

            socket.onopen = function (event) {
                console.log("WebSocket连接已建立");
                var rt = document.getElementById("responseText");
                rt.value = "建立WebSocket连接....\n";

                // 发送连接消息
                var userId = document.getElementById("userId").value;
                var message = {
                    type: 1, // 连接消息类型
                    roomId: 123, // 示例房间ID
                    fromUserId: userId ? parseInt(userId) : null,
                    body: [],
                    fromUserName: "用户名"
                };
                socket.send(JSON.stringify(message));
            };

            socket.onmessage = function (event) {
                console.log("收到消息：", event.data);
                var rt = document.getElementById("responseText");
                rt.value = rt.value + "\n" + event.data;
            };

            socket.onclose = function (event) {
                console.log("WebSocket连接已关闭，代码：" + event.code + "，原因：" + event.reason);
                var rt = document.getElementById("responseText");
                rt.value = rt.value + "\n连接已关闭，代码：" + event.code + "，原因：" + event.reason;
            };

            socket.onerror = function (error) {
                console.log("WebSocket错误：", error);
                var rt = document.getElementById("responseText");
                rt.value = rt.value + "\nWebSocket错误：" + error.message;
            };
        }

        // 发送消息
        function send(messageText) {
            if (!socket || socket.readyState !== WebSocket.OPEN) {
                alert("WebSocket连接未建立");
                return;
            }

            var userId = document.getElementById("userId").value;
            var message = {
                type: 3, // 聊天消息类型
                roomId: 123, // 示例房间ID
                fromUserId: userId ? parseInt(userId) : null,
                body: [{ content: messageText }],
                fromUserName: "用户名"
            };
            socket.send(JSON.stringify(message));
        }

        // 断开连接
        function disconnect() {
            if (socket) {
                var userId = document.getElementById("userId").value;
                var message = {
                    type: 2, // 断开连接消息类型
                    roomId: 123, // 示例房间ID
                    fromUserId: userId ? parseInt(userId) : null,
                    body: [],
                    fromUserName: "用户名"
                };
                socket.send(JSON.stringify(message));
                socket.close();
                socket = null;
            }
        }
    </script>
</head>
<body>
<h1>WebSocket测试页面</h1>
<div>
    <label for="userId">用户ID:</label>
    <input type="text" id="userId" placeholder="输入您的用户ID">
</div>
<div>
    <button onclick="connect()">连接</button>
    <button onclick="disconnect()">断开连接</button>
</div>
<div>
    <label for="message">消息:</label>
    <input type="text" id="message" placeholder="输入要发送的消息">
    <button onclick="send(document.getElementById('message').value)">发送消息</button>
</div>
<div>
    <textarea id="responseText" rows="10" cols="50" readonly></textarea>
</div>
</body>
</html>
