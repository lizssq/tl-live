<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手机号登录</title>
    <script>
        // 发送登录短信
        function sendLoginSms() {
            var mobile = document.getElementById("phone").value;
            if (mobile.length !== 11) {
                alert("请输入有效的11位手机号");
                return;
            }

            fetch("http://localhost/sms/sendLoginSms", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: new URLSearchParams({
                    "mobile": mobile
                })
            })
                .then(response => response.json())
                .then(data => {
                    if (data.code === 200) {
                        alert("短信发送成功");
                    } else {
                        alert("短信发送失败：" + data.message);
                    }
                })
                .catch(error => {
                    console.error("发送短信时出错:", error);
                    alert("发送短信时出错，请稍后再试");
                });
        }

        // 登录
        function loginPhone() {
            var phone = document.getElementById("phone").value;
            var code = document.getElementById("code").value;

            if (phone.length !== 11) {
                alert("请输入有效的11位手机号");
                return;
            }

            if (code.length !== 4) {
                alert("请输入4位验证码");
                return;
            }

            var loginData = {
                "phone": phone,
                "code": parseInt(code)
            };

            fetch("http://localhost/sms/loginPhone", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(loginData)
            })
                .then(response => response.json())
                .then(data => {
                    if (data.code === 200) {
                        alert("登录成功");
                        // 处理登录成功后的逻辑，比如跳转到首页
                    } else {
                        alert("登录失败：" + data.message);
                    }
                })
                .catch(error => {
                    console.error("登录时出错:", error);
                    alert("登录时出错，请稍后再试");
                });
        }
    </script>
</head>
<body>
<h1>手机号登录</h1>
<div>
    <label for="phone">手机号:</label>
    <input type="text" id="phone" placeholder="请输入您的手机号">
    <button onclick="sendLoginSms()">发送验证码</button>
</div>
<div>
    <label for="code">验证码:</label>
    <input type="text" id="code" placeholder="请输入验证码">
</div>
<div>
    <button onclick="loginPhone()">登录</button>
</div>
</body>
</html>
